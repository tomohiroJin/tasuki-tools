name: E2E repeat

# E2E の不安定さを測る、手動起動だけのワークフロー（#562・#495）。
# **push・pull_request では走らない。CI の合否にも、PR の検査にも入れない。**
# 起こし方と結果の読み方は docs/guides/development.md の「E2E の不安定さを測る」。
on:
  workflow_dispatch:
    inputs:
      repeat:
        description: "pnpm e2e -- --repeat-each=<回数>。各テストを何回流すか"
        type: choice
        options: ["3", "5", "10", "20"]
        default: "5"

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

# 同じ ref で重ねて流すと、同じ資源を奪い合って揺れを増やす。待つのは 1 本までで、3 本目を起こすと待っていた方が取り消される
  # （cancel-in-progress: false は走っている実行を打ち切らない）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e-repeat:
    runs-on: ubuntu-latest
    # 上限 = 準備と後片付け 15 分 + 回数 × 6 分。ci.yml の e2e は 1 回で約 4.5 分（準備を除く pnpm e2e は 2026-11-05 の
    # main の 3 回で 4〜4.6 分）。繰り返しは並列に流れるので、回数に比例するとみなすのは上限としては安全側。
    # GitHub Actions の式は算術を持たないので、回数ごとの上限を表で引く（回数 × 6 + 15。選べる回数がすべて表にあることは
    # scripts/e2e-repeat-workflow.test.mjs が見る）。最大 20 回で 135 分で、固まったときに既定の 360 分まで待たない。
    # 実測が上限の半分に収まらない・超えそうなら、上げる前に回数か並べ方を見直す。
    timeout-minutes: ${{ fromJSON('{"3":33,"5":45,"10":75,"20":135}')[inputs.repeat] }}
    steps:
      # ここから `pnpm build` までは ci.yml の e2e ジョブと同じ準備。**写しなので、ずれたら
      # scripts/e2e-repeat-workflow.test.mjs が落ちる**（ci.yml の `scope` の段と、それを見る `if:` だけが違う。
      # この手動のジョブは常に全部流す）。ci.yml 側を直したら、ここも同じに直す。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # 版の正本は toolchain.json（#487・docs/adr/0031）。**このファイルに版を書かない**（scripts/audit-toolchain.mjs が見る）。
      # setup-node より前なので jq で読む（ubuntu-latest に入っている）。-e で、無いキーを null のまま渡さない。
      - id: toolchain
        run: |
          node_version="$(jq -er .node toolchain.json)"
          bun_version="$(jq -er .bun toolchain.json)"
          caddy_version="$(jq -er .caddy toolchain.json)"
          { echo "node=$node_version"; echo "bun=$bun_version"; echo "caddy=$caddy_version"; } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ steps.toolchain.outputs.node }}

      - run: corepack enable

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.toolchain.outputs.bun }}

      - run: pnpm install --frozen-lockfile

      - name: Cache Caddy
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/tasuki-e2e
          key: caddy-${{ steps.toolchain.outputs.caddy }}

      - id: playwright-version
        run: echo "version=$(node -p "require('./e2e/package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright-version.outputs.version }}-chromium
      - run: pnpm --filter @tasuki/e2e exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: pnpm --filter @tasuki/e2e exec playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - run: pnpm build

      # ここから先がこのワークフロー固有。
      # - `--retries=0`: CI（CI=true）の設定は再試行 1 回。再試行で隠れる揺れを数えるために 0 にする。
      # - `--trace=retain-on-failure`: 設定の trace は on-first-retry で、retries 0 では作られない。揺れの原因を追うために落ちた回の trace を残す。
      # - `--max-failures` は付けない: 落ちても最後まで流す。
      # - reporter は設定の list・html のうち html を json に替える（--reporter は設定を丸ごと置き換える）。
      #   JSON の出力先は環境変数で渡す（turbo.json の e2e の passThroughEnv に宣言がある）。
      # 回数は env 経由で渡す（式を run へ直接書かない）。
      - name: E2E を繰り返し流す
        env:
          REPEAT: ${{ inputs.repeat }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/e2e-repeat-results/results.json
        run: |
          mkdir -p "$GITHUB_WORKSPACE/e2e-repeat-results"
          pnpm e2e -- --repeat-each="$REPEAT" --retries=0 --trace=retain-on-failure --reporter=list,json

      # 落ちても、E2E の段が赤でも要約を出す。結果が読めないときはこの段が赤になる（空の要約で緑にしない）。
      - name: 集計（job summary）
        if: always()
        env:
          RESULTS: ${{ github.workspace }}/e2e-repeat-results/results.json
          FAILURES: ${{ github.workspace }}/e2e-repeat-results/failures.txt
        run: node scripts/summarize-e2e-repeat.mjs "$RESULTS" --failures-out "$FAILURES" >> "$GITHUB_STEP_SUMMARY"

      # 結果の JSON・落ちたテストの一覧・失敗時の成果物（Caddy と 2 つの sync のログ・trace・動画）。
      - name: Upload E2E repeat results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-repeat-results
          path: |
            e2e-repeat-results/
            e2e/test-results/
          if-no-files-found: warn
          retention-days: 14
