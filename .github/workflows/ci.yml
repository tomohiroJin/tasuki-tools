name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# corepack が pnpm を取得するとき、非対話環境で確認プロンプトを出さない
env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  timer:
    name: tdd-mob-pro-timer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tdd-mob-pro-timer
    steps:
      - uses: actions/checkout@v4

      # pnpm の版は各ディレクトリの package.json の packageManager 宣言に従わせる。
      # pnpm/action-setup で版を固定すると、timer(9.15.0) と poker(11.5.0) の
      # 食い違いをどちらかに寄せることになり、ローカルと CI で挙動が変わる。
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  poker:
    name: planning-poker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: planning-poker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable

      - run: pnpm install --frozen-lockfile
      # poker には lint / test:unit が無い（S1-b で lint を追加する）
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
