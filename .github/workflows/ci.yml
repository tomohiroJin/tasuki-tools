name: CI

on:
  push:
    branches: [main]
  # base を限定しない。branches: [main] にすると、段階的な作業でブランチを
  # 積み上げたとき（PR の base が main 以外）に checks が 1 つも出ず、
  # 「CI が通っている」を前提にできなくなる（#50 と同じ穴の別の形）。
  pull_request:

# GITHUB_TOKEN の権限を最小にする（ADR 0012 D8 / ADR 0011 S13）。
# ワークフロー全体の既定を read にし、必要なジョブだけが個別に足す。
# 現状どのジョブも書き込みを必要としない。
permissions:
  contents: read

# corepack が pnpm を取得するとき、非対話環境で確認プロンプトを出さない
env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

# 連続 push で古い実行を打ち切る。**main への push は打ち切らない**
# （マージ後の実行は「main が緑である」という記録そのもののため）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 差分の取得に必要。.git は 17MB / 713 コミットで数秒。
          fetch-depth: 0

      # Node 22 必須。ルートが宣言する pnpm 11.5.0 は node:sqlite（Node 22.5 以降）を
      # 使うため、Node 20 では ERR_UNKNOWN_BUILTIN_MODULE で起動すらしない。
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # 走らせる範囲を決める。ジョブ単位の if ではなくステップ単位の if を使い、
      # ジョブは常に起動して常に success を報告する（必須チェックにしても壊れない）。
      - id: scope
        run: node scripts/ci-scope.mjs

      # pnpm の版はルート package.json の packageManager 宣言に従わせる
      - run: corepack enable
        if: steps.scope.outputs.code == 'true'

      # poker-sync は Bun 必須。tests/helpers.ts が `bun run src/server.ts` を
      # サブプロセス起動し、build も `bun build --target=bun` を使う。
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.scope.outputs.code == 'true'
        with:
          bun-version: latest

      - run: pnpm install --frozen-lockfile
        if: steps.scope.outputs.code == 'true'

      # 単一のタスクグラフで全 6 パッケージを検証する
      - run: pnpm typecheck
        if: steps.scope.outputs.code == 'true'
      - run: pnpm lint
        if: steps.scope.outputs.code == 'true'
      - run: pnpm test
        if: steps.scope.outputs.code == 'true'
      - run: pnpm build
        if: steps.scope.outputs.code == 'true'

  # 依存の脆弱性検査。high 以上で落とす（moderate 以下は出力に残すだけ）。
  # 判断の根拠は docs/adr/0008。既存の ci ジョブには足さない。
  # e2e と同じく独立ジョブにする（結果を見るのにテストの所要時間を待たせないため）。
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - id: scope
        run: node scripts/ci-scope.mjs
      - run: corepack enable
        if: steps.scope.outputs.deps == 'true'
      - run: pnpm install --frozen-lockfile
        if: steps.scope.outputs.deps == 'true'
      # moderate 以下も内容が見えるように、まず全件を出力に残す
      - run: pnpm audit || true
        if: steps.scope.outputs.deps == 'true'
      # high 以上でだけ落とす
      - run: pnpm audit --audit-level high
        if: steps.scope.outputs.deps == 'true'

  # E2E は既存の検査と**並列の別ジョブ**にする。同じジョブに足すと、
  # ユニットテストの結果を見るのに E2E の所要時間を待つことになる。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # 走らせる範囲を決める。ジョブ単位の if ではなくステップ単位の if を使い、
      # ジョブは常に起動して常に success を報告する（必須チェックにしても壊れない）。
      - id: scope
        run: node scripts/ci-scope.mjs

      - run: corepack enable
        if: steps.scope.outputs.code == 'true'

      # sync サーバーは両方とも Bun で起動する。
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.scope.outputs.code == 'true'
        with:
          bun-version: latest

      - run: pnpm install --frozen-lockfile
        if: steps.scope.outputs.code == 'true'

      # Caddy 断片が root * /var/www/... を絶対値で宣言しているため、
      # 環境側を断片に合わせる。**ubuntu-latest に /var/www は無い。**
      - run: sudo mkdir -p /var/www
        if: steps.scope.outputs.code == 'true'

      # 版を固定してキャッシュする。「最新」を取ると、ある日突然赤くなる。
      - name: Cache Caddy
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.scope.outputs.code == 'true'
        with:
          path: ~/.cache/tasuki-e2e
          key: caddy-2.11.4

      # Playwright の版は package.json で完全固定している。
      # revision は版に 1 対 1 で紐づくので、版をそのまま鍵にする。
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.scope.outputs.code == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.62.1-chromium
      - run: pnpm --filter @tasuki/e2e exec playwright install --with-deps chromium
        if: steps.scope.outputs.code == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
      - run: pnpm --filter @tasuki/e2e exec playwright install-deps chromium
        if: steps.scope.outputs.code == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'

      - run: pnpm build
        if: steps.scope.outputs.code == 'true'
      - run: pnpm e2e
        if: steps.scope.outputs.code == 'true'

      # 落ちたときに原因が追えるように、Caddy と 2 つの sync のログまで残す。
      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-artifacts
          path: e2e/test-results/
          retention-days: 7

  # リンク検査。**絞り込まない。**
  # リンクはコードを変えたときにこそ壊れる（ファイルの移動・削除で
  # 現役文書のバッククォート内パスが宙に浮く）。「文書が変わったときだけ」
  # にすると、その経路を取り逃がす。pnpm install は不要。
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/check-links.mjs

      # 実装計画の Constitution Check ゲート（#155・#135 経路⑨）。**quality ジョブへ
      # 置いてはならない。** あちらのステップは code == 'true' で絞り込まれ、
      # *.md だけの PR では走らない。plan は *.md なので、**ゲートを持たない plan を足す
      # PR がちょうど絞り込みで外れる**（この検査が捕まえるはずの形そのもの）。
      # docs ジョブは絞り込まず、pnpm install も要らない（git ls-files とファイル読み取りだけ）。
      - run: node scripts/audit-plan-gate.mjs

  # 手動でしか走らなかった検査を寄せる。ci に混ぜると臨界経路が
  # 2 分 12 秒 → 2 分 42 秒 に伸びるので独立ジョブにする。
  # mutation-check.mjs は変異が属するパッケージの test スクリプトに実際のランナーを
  # 合わせる（apps/timer-sync は bun test）。そのため setup-bun が必要。
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - id: scope
        run: node scripts/ci-scope.mjs
      - run: corepack enable
        if: steps.scope.outputs.code == 'true'

      # mutation-check.mjs が apps/timer-sync の変異を bun test で実行するため必要。
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.scope.outputs.code == 'true'
        with:
          bun-version: latest

      # **素の `pnpm install` に戻さないこと。** ラッパは install を包んで、供給網ポリシーの
      # 検証（minimumReleaseAge / trustPolicy の再適用）が実際に走ったことを確かめる
      # （#154・#135 経路⑫）。検証は 2 段の短絡で無警告のまま消える。1 回の CI につき
      # この 1 ジョブだけが目撃者で、他ジョブの install は素のままでよい（設計正本 D5）。
      # ラッパへ `--config.optimistic-repeat-install=false` を足してはならない。足すと
      # 合成した経路を判定することになり、実経路の無検証を見逃す。
      - run: node scripts/install-with-supply-chain-check.mjs
        if: steps.scope.outputs.code == 'true'

      # 構造監査の測定値（SC027〜SC039）は合否を持たない。値の合否は自己テストと変異検査で取る（ADR 0009 D2）。
      # 例外: 走査対象の健全性（宣言と実体のずれ・走査 0 件）は合否を持つ。
      # このステップは走査対象がずれれば実際に赤くなる（ADR 0009 D2 の例外・ADR 0014 決定 7・決定 8）。
      - run: node scripts/audit-structure.mjs
        if: steps.scope.outputs.code == 'true'

      # ログ衛生。資格情報・個人に紐づく情報がログ経路へ流れないことを見る（ADR 0012 D1）。
      - run: node scripts/audit-log-hygiene.mjs
        if: steps.scope.outputs.code == 'true'

      # 組み立ての集約。同期サーバーのエントリが create-sync-server.ts を経由し、
      # Bun.serve をエントリに持たないことを見る（ADR 0004 決定 4 の MUST・#165）。
      - run: node scripts/audit-assembly-wiring.mjs
        if: steps.scope.outputs.code == 'true'

      # ドメインエラー型の形。core のエラー型が表示文言（message）を持たないことを見る
      # （ADR 0016 決定 2 項目 3 が #72 E2 へ割り当てた機械検査・#165）。
      - run: node scripts/audit-domain-error-shape.mjs
        if: steps.scope.outputs.code == 'true'

      # ドメインの副作用。core が環境から直接値を読んでいないことを見る
      # （ADR 0016 決定 2 項目 4 が #72 E3 へ割り当てた機械検査・#166）。
      - run: node scripts/audit-domain-side-effects.mjs
        if: steps.scope.outputs.code == 'true'

      # 依存の向き。パッケージ間の依存が許可表の内側に収まっていることを見る
      # （憲法 原則 VI が MUST としながら検査が 1 つも無かった。ADR 0017 決定 4・#95 S1）。
      # 権威は pnpm 自身なので install の後ろに置く。
      - run: node scripts/audit-dependency-direction.mjs
        if: steps.scope.outputs.code == 'true'

      # web 層の同期境界。画面が同期クライアントを直接 import しないことを見る
      # （ADR 0015 MUST 2 が #72 E4 へ割り当てた機械検査・#167）。
      - run: node scripts/audit-web-sync-boundary.mjs
        if: steps.scope.outputs.code == 'true'

      # 公開面。エントリが export * を使わず公開記号を明示列挙していることを見る
      # （ADR 0016 決定 2 項目 2 が #72 E6 へ割り当てた機械検査・#168）。
      - run: node scripts/audit-public-surface.mjs
        if: steps.scope.outputs.code == 'true'

      # pnpm の供給網設定の退化。除外の版指定・死んだ除外行・未知のキーと値を見る
      # （#154・#135 経路⑤⑥⑦）。権威は pnpm 自身（pnpm config list / pnpm why）。
      # どちらも pnpm-lock.yaml があれば動くので install 済みであることは要らないが、
      # このジョブでは install の後ろに置く（順序を保証する側が 1 つで済む）。
      - run: node scripts/audit-supply-chain-config.mjs
        if: steps.scope.outputs.code == 'true'

      # 対象は列挙しない。scripts/ 配下の *.test.mjs を git から導出する。
      # 列挙をハードコードすると、新しいテストが黙って走らない（#135 経路⑬）。
      - name: scripts の自己テスト
        if: steps.scope.outputs.code == 'true'
        shell: bash
        run: |
          set -euo pipefail
          targets="$(node scripts/list-scan-targets.mjs script-tests)"
          node --test $targets

      # 変異検査は作業ツリーが clean であることを要求する。
      # actions/checkout 直後は clean で、pnpm install は追跡ファイルを変更しない。
      - run: node scripts/mutation-check.mjs
        if: steps.scope.outputs.code == 'true'

      # shellcheck。対象は git から導出する（グロブが非再帰でサブディレクトリの
      # .sh が無検査だった。#135 経路④）。除外は無い（#71 で .specify/ を廃止。ADR 0009 追記）。
      - name: shellcheck
        if: steps.scope.outputs.code == 'true'
        shell: bash
        run: |
          set -euo pipefail
          targets="$(node scripts/list-scan-targets.mjs shell)"
          shellcheck -x --source-path=deploy --severity=warning $targets
