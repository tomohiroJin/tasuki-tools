<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tasuki 進行役ルーレット</title>
    <!--
      Slack に出る紹介（OGP・Twitter Card）と、タブ・ホーム画面のアイコンの指定。
      robots.txt を守る取得役（X の Twitterbot など）は Disallow: / のため取らない（検索除外は意図して残す）。
      6 ページで同じ形に揃え、tools.ts との一致も含めて index-html-exterior.test.ts で固定している。
    -->
    <meta name="description" content="その場で進行役を決める" />
    <meta name="theme-color" content="#0a2b21" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tasuki" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:title" content="Facilitator Roulette — Tasuki" />
    <meta property="og:description" content="その場で進行役を決める" />
    <meta property="og:image" content="https://tasuki.niku9.click/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tasuki — 緑の卓に置かれたトランプの札" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Facilitator Roulette — Tasuki" />
    <meta name="twitter:description" content="その場で進行役を決める" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <!--
      React 起動前（HTML 到着 → JS 取得・解析 → 起動）を埋める静的なプレースホルダ。
      CSS がまだ当たっていないため色はインラインで指定するしかない。
      背景/文字色は packages/ui/src/tokens/palette.css の --felt-950 / --ivory と
      一致させ、apps/landing/tests/index-html-loading-placeholder.test.ts で固定する。
    -->
    <div id="root">
      <div
        role="status"
        aria-live="polite"
        style="position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #071f18; color: #f5efdd; font-family: system-ui, -apple-system, sans-serif"
      >
        読み込んでいます…
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
