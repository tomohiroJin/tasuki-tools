packages:
  - "packages/*"
  - "apps/*"
  - "e2e"

# poker の依存に esbuild が含まれ、ビルドスクリプトの実行許可が要る（旧 planning-poker 由来）
allowBuilds:
  esbuild: true

# 作業パッケージ（@tasuki/*）をルートの node_modules へ持ち上げない。
# 9p の遅さを避けて仮想ストアの実体をホームへ逃がす配置（--virtual-store-dir=.pnpm-virtual）では、
# pnpm 11.28 以降が持ち上げを ERR_PNPM_INVALID_DEPENDENCY_NAME で拒み、install もスクリプト前の
# 依存の確認も止まる。作業パッケージは各パッケージの依存として直接リンクされるので、持ち上げは要らない。
# 名前で読むなら、読む側の package.json に workspace:* で宣言すること。
# CI は逃がさないので、この行を消しても true にしても CI は緑のまま手元だけが壊れる。
# そのため scripts/audit-supply-chain-config.mjs が false を必須として見ている（#439）。
# 手順は docs/guides/development.md の「9p 越しで実行するときは依存の実体を逃がす」を参照。
hoistWorkspacePackages: false

# 公開直後の版を掴まないための待機期間（単位: 分。10080 = 7 日）。
# npm パッケージの乗っ取り・改ざんは公開から数日以内に発覚することが多いため、
# 公開から 7 日未満の版は pnpm install の段で拒否する。
# pnpm はこの制約を lockfile の各エントリにも毎回再適用するので、
# ローカルで迂回して作られた lockfile は CI で弾かれる。
# 判断の根拠は docs/adr/0008、運用手順は docs/guides/development.md を参照。
minimumReleaseAge: 10080

# 信頼証跡（provenance / trusted publisher / staged publish）の降格を拒否する。
# 乗っ取り（盗んだトークンで、CI を経由せず＝証跡なしに publish される）を、
# 公開から 7 日を過ぎていても弾く。待機期間とは直交する防御。
# 判定は公開日のみで行われ semver の系列を見ないため、旧系列の保守版は偽陽性になる。
# 判断の根拠は docs/adr/0010、運用手順は docs/guides/development.md を参照。
trustPolicy: no-downgrade

# overrides（推移依存の版の下限を引き上げる仕組み）は、いま 1 件も置いていない。
# 書き方・使う条件・削除の条件は docs/adr/0008 と docs/guides/development.md が正本。
#
# **置く前に「捨てて解き直す」で測ること。** 既存の lockfile を残したまま親を更新して
# 「版が上がらない」ことを見ても、それは据え置きと区別が付かない（＝測定になっていない）。
# #265 の js-yaml でこれを踏み、要らない overrides を一度置いてから外した。
# 手順は docs/guides/development.md の「使う前に確かめること」にある。
#
# 過去にあった "nanoid@3": "^3.3.18" は #199 で削除した。捨てて解き直すと override 無しでも
# postcss@8.5.26 が nanoid@3.3.18 を選ぶ（＝親の要求だけで足りる）ため。
# 要らなくなった行を残すと、親の要求が下がったときにそれを黙って覆い隠す。
