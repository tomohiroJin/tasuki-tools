# 進行タイマーの配信断片（#429）
# 設置先: /etc/caddy/tasuki/apps/60-agenda.conf
#
# この断片を置いた瞬間に /agenda/ が公開される。**置き忘れると /agenda/ は包括フォールバック
# （玄関）に吸われ、札を押しても玄関が再描画されるだけになる**（本番の /poker 事故と同じ型。
# ../../caddy/README.md）。
#
# 番号は人が読むための規約。Caddy はマッチャの具体性で並べ替えるので、/agenda/* は
# 包括フォールバックより必ず先に評価される。
#
# WebSocket の handle は置かない。入口は `/ws`（`../landing/caddy/05-hub-ws.conf`）の 1 本で、
# 進行タイマーはクエリ（`?tool=agenda`）で宣言する。
#
# 60 番は空き番号（05・20・30・40・50・90 が使用中）。/agenda/* は既存の断片と接頭辞が重ならない。

# 静的配信（SPA フォールバック付き・base=/agenda/ でビルドしたもの）
handle_path /agenda/* {
	root * /var/www/tasuki-agenda
	# 拡張子つきの欠落（/no-such.txt・消えた資材）は 404 のままにし、拡張子なしの経路
	# （SPA のルート・/?room=…）だけ index.html へ書き換える。try_files では
	# 欠落が index.html の 200 に化け、存在確認も資材の消失も見えなくなる（#434）。
	# 名前付きマッチャは handle ごとに閉じるので、各断片で @spa を使い回してよい。
	@spa {
		not file
		not path_regexp \.[^/]*$
	}
	rewrite @spa /index.html
	file_server
}

# /agenda（末尾スラッシュなし）を /agenda/ へ
redir /agenda /agenda/ permanent
