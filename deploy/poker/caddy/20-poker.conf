# Planning Poker の配信断片
# 設置先: /etc/caddy/tasuki/apps/20-poker.conf
#
# この断片を置いた瞬間に /poker/ が公開される。S4（#19）が poker の初回公開。
# 前提の防御（Origin 検査・サイズ制限・接続数上限・死活監視）は #63 で入っている。
#
# 番号は人が読むための規約。Caddy はマッチャの具体性で並べ替えるので、ここの
# /poker/* は包括フォールバック（LP）より必ず先に評価される。
# 本番で /poker が timer の index.html を返していたのは順序のせいではなく、
# **この断片が存在しなかった**ため包括フォールバックに吸われていたから。

# WebSocket は #95 S5c でここから撤去した。統合 sync（8787）への WS 入口は
# `/ws`（`../landing/caddy/05-hub-ws.conf`）の 1 本だけで、poker はクエリ
# （`?tool=poker`）で宣言する（`apps/tasuki-sync/src/adapters/ws-adapter.ts`）。
# ここに `/poker/ws` の handle を残すと、下の SPA フォールバックより先に評価される
# 死んだ設定として残る（`apps/landing/tests/caddy-fragment-port.test.ts` が固定）。

# 静的配信（SPA フォールバック付き・base=/poker/ でビルドしたもの）
handle_path /poker/* {
	root * /var/www/tasuki-poker
	# 拡張子つきの欠落（/no-such.txt・消えた資材）は 404 のままにし、拡張子なしの経路
	# （SPA のルート・/?room=…）だけ index.html へ書き換える。try_files では
	# 欠落が index.html の 200 に化け、存在確認も資材の消失も見えなくなる（#434）。
	# 名前付きマッチャは handle ごとに閉じるので、各断片で @spa を使い回してよい。
	@spa {
		not file
		not path_regexp \.[^/]*$
	}
	rewrite @spa /index.html
	file_server
}

# /poker（末尾スラッシュなし）を /poker/ へ
redir /poker /poker/ permanent
