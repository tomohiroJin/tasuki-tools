# Planning Poker の配信断片
# 設置先: /etc/caddy/tasuki/apps/20-poker.conf
#
# この断片を置いた瞬間に /poker/ が公開される。S4（#19）が poker の初回公開。
# 前提の防御（Origin 検査・サイズ制限・接続数上限・死活監視）は #63 で入っている。
#
# 番号は人が読むための規約。Caddy はマッチャの具体性で並べ替えるので、ここの
# /poker/* は包括フォールバック（LP）より必ず先に評価される。
# 本番で /poker が timer の index.html を返していたのは順序のせいではなく、
# **この断片が存在しなかった**ため包括フォールバックに吸われていたから。

# WebSocket リバースプロキシ（/poker/ws → sync の /ws）
handle /poker/ws {
	rewrite * /ws
	reverse_proxy 127.0.0.1:3311
}

# 静的配信（SPA フォールバック付き・base=/poker/ でビルドしたもの）
handle_path /poker/* {
	root * /var/www/tasuki-poker
	try_files {path} /index.html
	file_server
}

# /poker（末尾スラッシュなし）を /poker/ へ
redir /poker /poker/ permanent
