# Planning Poker の配信断片
# 設置先: /etc/caddy/tasuki/apps/20-poker.conf
#
# この断片を置いた瞬間に /poker/ が公開される。S4（#19）が poker の初回公開。
# 前提の防御（Origin 検査・サイズ制限・接続数上限・死活監視）は #63 で入っている。
#
# 番号は人が読むための規約。Caddy はマッチャの具体性で並べ替えるので、ここの
# /poker/* は包括フォールバック（LP）より必ず先に評価される。
# 本番で /poker が timer の index.html を返していたのは順序のせいではなく、
# **この断片が存在しなかった**ため包括フォールバックに吸われていたから。

# WebSocket リバースプロキシ（/poker/ws → 統合 sync の :8787）
#
# ⚠ **rewrite しない。** #95 S2 で timer と poker の sync サーバーを 1 プロセスへ
# 統合した（`apps/tasuki-sync`）。統合サーバーは 1 つの待ち受けで 2 つのプロトコルを
# 捌いており、**どちらへ流すかをパスだけで決めている**。ここで /ws へ剥がすと
# timer 側のメッセージ層へ流れ、poker のコマンドが INVALID_COMMAND で弾かれる。
# 剥がしているのは timer 側の断片（10-timer-ws.conf）だけである。
#
# 対応は apps/tasuki-sync/src/adapters/ws-adapter.ts の POKER_WS_PATH と、
# apps/landing/tests/caddy-fragment-port.test.ts が機械的に固定している。
handle /poker/ws {
	reverse_proxy 127.0.0.1:8787
}

# 静的配信（SPA フォールバック付き・base=/poker/ でビルドしたもの）
handle_path /poker/* {
	root * /var/www/tasuki-poker
	try_files {path} /index.html
	file_server
}

# /poker（末尾スラッシュなし）を /poker/ へ
redir /poker /poker/ permanent
