# timer の静的 SPA 配信（ディープリンクは index.html へフォールバック）
# 設置先: /etc/caddy/tasuki/apps/90-timer-spa.conf
#
# **これは包括フォールバックなので、必ず最後に読ませる。** 90- の番号はそのため。
# root はサイトブロック（site.conf）の `root * /var/www/tasuki` を継承する。
#
# 注意: この handle があるため、他のアプリの断片がこれより後に来ると一切効かない。
# 本番で /poker が timer の index.html を 200 で返していたのは、poker の断片が
# そもそも存在せずここに吸われていたため。
handle {
	try_files {path} /index.html
	file_server
}
