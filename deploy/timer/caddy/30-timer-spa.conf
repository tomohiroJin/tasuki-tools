# timer の静的 SPA 配信（ディープリンクは index.html へフォールバック）
# 設置先: /etc/caddy/tasuki/apps/30-timer-spa.conf
#
# S4（#19）で **包括フォールバックから /timer/ 限定へ変えた**。ルートは玄関 LP が
# 占めるようになったため、timer はサブパスの一アプリになる（poker と同じ形）。
#
# ⚠ 旧 90-timer-spa.conf を**ホストから消すこと**。残っても /timer/ は壊れないが
# （包括が 2 本になり、名前が先の 90-landing.conf だけが効く）、死んだ設定が残る。
#
# 番号は人が読むための規約。Caddy はマッチャの具体性で並べ替えるので、この断片の
# /timer/* は包括フォールバックより必ず先に評価される（詳細は ../../caddy/README.md）。
#
# root はここで明示する。サイトブロックの root には依存しない
# （どの断片も自分の配信元を自分で宣言する）。
handle_path /timer/* {
	root * /var/www/tasuki
	try_files {path} /index.html
	file_server
}

# /timer（末尾スラッシュなし）を /timer/ へ
redir /timer /timer/ permanent
