# 旧共有リンクの救済（S4 / #19）
# 設置先: /etc/caddy/tasuki/apps/40-timer-legacy-room.conf
#
# timer がルート（/）で配信されていた頃、ルームの共有リンクは
# `https://<host>/?room=CODE` というクエリ形式だった（apps/timer-web の App.tsx）。
# S4 でルートが LP になったため、この形のリンクは LP に着地してコードが失われる。
#
# **ルート、かつ room クエリが付いているときだけ** timer へ送る。クエリは丸ごと
# 引き継ぐ。room が無い素の `/` は LP のままなので、玄関の役割は損なわれない。
#
# 順序: 90-landing.conf（包括フォールバック）より前に読ませること。
# 後ろに来ると LP に吸われてこの救済は一切効かない。
@legacy-room {
	path /
	query room=*
}
redir @legacy-room /timer/?{query} permanent
