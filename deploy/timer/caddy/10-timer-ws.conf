# timer の WebSocket 同期サーバーへのリバースプロキシ（Upgrade は Caddy が自動処理）
# 設置先: /etc/caddy/tasuki/apps/10-timer-ws.conf
#
# S4（#19）で /ws から /timer/ws へ移した。公開パスが /timer/ になったので WS も
# 同じ配下に置き、公開パスを剥がして sync へ渡す。
#
# rewrite の意味は #95 S2 の統合で変わった。**いまは「timer 側を選ぶ」指定である。**
# 統合サーバー（apps/tasuki-sync）は 1 つの待ち受けで 2 つのプロトコルを捌き、
# 振り分けをパスだけで決める。`/poker/ws` 以外はすべて timer へ流れるので、
# `/ws` へ剥がしても剥がさなくても timer に届く（20-poker.conf は剥がしてはならない。
# 剥がすと poker のコマンドが timer 側へ流れて INVALID_COMMAND になる）。
# 移行期は `/ws`・`/timer/ws`・`/poker/ws` の 3 つを受ける（設計正本 D10）。
#
# ここで受けるパスは apps/timer-web/src/sync/sync-url.ts の SYNC_PATH と一致して
# いる必要がある。食い違うと WS が繋がらないのに、どちらのファイルも正しく見える。
# test/sync/sync-url.test.ts がこの一致を機械的に固定している。
handle /timer/ws {
	rewrite * /ws
	reverse_proxy 127.0.0.1:8787
}
