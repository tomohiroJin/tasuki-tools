# timer の WebSocket 同期サーバーへのリバースプロキシ（Upgrade は Caddy が自動処理）
# 設置先: /etc/caddy/tasuki/apps/10-timer-ws.conf
#
# S4（#19）で /ws から /timer/ws へ移した。公開パスが /timer/ になったので WS も
# 同じ配下に置き、公開パスを剥がして sync へ渡す。
#
# ⚠ **rewrite しない**（#95 S5a で `rewrite * /ws` を外した）。
#
# S2 の統合以降、統合サーバー（apps/tasuki-sync）は 1 つの待ち受けで複数のメッセージ層を
# 捌き、**どれへ流すかをパスだけで決めている**。S5a で `/ws` がハブ（選択画面）の入口に
# なったため、ここで `/ws` へ剥がすと **timer の接続がハブとして扱われ、timer の
# 参加者一覧から全員が消える**。剥がさなければ「`/poker/ws` でも `/ws` でもない」＝
# timer として届く。
#
# 振り分けの対応は apps/tasuki-sync/src/adapters/ws-adapter.ts が正本で、
# apps/landing/tests/caddy-fragment-port.test.ts が断片との一致を機械的に固定している。
# 移行期は `/ws`・`/timer/ws`・`/poker/ws` の 3 つを受ける（設計正本 D10。S5c で `/ws` に畳む）。
#
# ここで受けるパスは apps/timer-web/src/sync/sync-url.ts の SYNC_PATH と一致して
# いる必要がある。食い違うと WS が繋がらないのに、どちらのファイルも正しく見える。
# test/sync/sync-url.test.ts がこの一致を機械的に固定している。
handle /timer/ws {
	reverse_proxy 127.0.0.1:8787
}
