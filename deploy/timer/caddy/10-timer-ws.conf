# timer の WebSocket 同期サーバーへのリバースプロキシ（Upgrade は Caddy が自動処理）
# 設置先: /etc/caddy/tasuki/apps/10-timer-ws.conf
#
# S4（#19）で /ws から /timer/ws へ移した。公開パスが /timer/ になったので WS も
# 同じ配下に置く。sync サーバー自身のパスは /ws のままなのでここで rewrite する
# （poker が /poker/ws で通った道と同じ形）。
#
# 90-landing.conf（包括フォールバック）より**先**に読まれる必要がある。
# 番号接頭辞がその順序を担保している。後ろに来ると WebSocket にならず、
# LP の index.html が 200 で返る。
handle /timer/ws {
	rewrite * /ws
	reverse_proxy 127.0.0.1:8787
}
