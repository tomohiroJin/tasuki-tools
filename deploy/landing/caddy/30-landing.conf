# Tasuki の玄関（LP）の配信断片
# 設置先: /etc/caddy/tasuki/apps/30-landing.conf
#
# S3（#18）の暫定パス /home/ で配信する。**既存 URL（/ = timer）には触れない。**
# S4（#19）でルートへ移し、この断片は差し替える。
#
# 順序: 10-timer-ws.conf の後、90-timer-spa.conf（包括フォールバック）の前。
# 90- より後ろに来ると一切効かない。

handle_path /home/* {
	root * /var/www/tasuki-home
	try_files {path} /index.html
	file_server
}

# /home（末尾スラッシュなし）を /home/ へ
redir /home /home/ permanent
