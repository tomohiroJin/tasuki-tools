# ハブ（選択画面）の WebSocket（#95 S5a）
# 設置先: /etc/caddy/tasuki/apps/05-hub-ws.conf
#
# LP が同期クライアントになり、ルームの作成・参加・名簿の受信をここで行う。
#
# ⚠ **rewrite しない。** 統合サーバー（apps/tasuki-sync）は 1 つの待ち受けで 3 つの
# メッセージ層を捌き、**どれへ流すかをパスだけで決めている**。`/poker/ws` は poker、
# `/ws` はハブ、それ以外は timer である
# （apps/tasuki-sync/src/adapters/ws-adapter.ts の POKER_WS_PATH と HUB_WS_PATH）。
#
# **包括フォールバック（90-landing.conf）より先に評価される。** Caddy はマッチャの
# 具体性でルートを並べ替えるため、パス指定のあるこの handle が先に当たる。番号は
# 人が読むための規約であって、安全性の根拠ではない（../../caddy/README.md の実測）。
#
# 断片とサーバーの対応は apps/landing/tests/caddy-fragment-port.test.ts が固定している。
handle /ws {
	reverse_proxy 127.0.0.1:8787
}
