# Tasuki の玄関（LP）の配信断片
# 設置先: /etc/caddy/tasuki/apps/90-landing.conf
#
# S4（#19）で暫定パス /home/ からルート（/）へ移した。
#
# **これは包括フォールバック（パス指定なしの handle）。** Caddy はマッチャの具体性で
# ルートを並べ替えるので、これは書いた位置に関わらず最後に評価される。90- の番号は
# 人が読むための規約であって、安全性の根拠ではない（実測: ../../caddy/README.md）。
#
# ⚠ **包括フォールバックを 2 本作らないこと。** 具体性が並ぶと名前が先の方だけが効き、
# もう片方は一度も評価されない。apps/landing/tests/caddy-fragment-order.test.ts が
# 「ちょうど 1 本」を機械的に固定している。
#
# ⚠ 旧 30-landing.conf を**ホストから消すこと**。残すと /home/ でも LP に到達でき、
# 公開 URL が 2 つある状態になる。
handle {
	root * /var/www/tasuki-home
	# 拡張子つきの欠落（/no-such.txt・消えた資材）は 404 のままにし、拡張子なしの経路
	# （SPA のルート・/?room=…）だけ index.html へ書き換える。try_files では
	# 欠落が index.html の 200 に化け、存在確認も資材の消失も見えなくなる（#434）。
	# 名前付きマッチャは handle ごとに閉じるので、各断片で @spa を使い回してよい。
	@spa {
		not file
		not path_regexp \.[^/]*$
	}
	rewrite @spa /index.html
	file_server
}
