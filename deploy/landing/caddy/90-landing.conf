# Tasuki の玄関（LP）の配信断片
# 設置先: /etc/caddy/tasuki/apps/90-landing.conf
#
# S4（#19）で暫定パス /home/ からルート（/）へ移した。
# **これは包括フォールバックなので、必ず最後に読ませる。** 90- の番号はそのため。
#
# ⚠ 旧 30-landing.conf を**ホストから消すこと**。残すと /home/ でも LP に到達でき、
# 公開 URL が 2 つある状態になる。
#
# 注意: この handle があるため、他のアプリの断片がこれより後に来ると一切効かない。
# timer / poker の断片はいずれも若い番号で、この前に評価される。
handle {
	root * /var/www/tasuki-home
	try_files {path} /index.html
	file_server
}
