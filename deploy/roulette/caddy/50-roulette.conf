# ルーレットの配信断片（#94）
# 設置先: /etc/caddy/tasuki/apps/50-roulette.conf
#
# この断片を置いた瞬間に /roulette/ が公開される。**置き忘れると /roulette/ は包括フォールバック
# （玄関）に吸われ、札を押しても玄関が再描画されるだけになる**（本番の /poker 事故と同じ型。
# ../../caddy/README.md）。
#
# 番号は人が読むための規約。Caddy はマッチャの具体性で並べ替えるので、/roulette/* は
# 包括フォールバックより必ず先に評価される。
#
# WebSocket の handle は置かない。入口は `/ws`（`../landing/caddy/05-hub-ws.conf`）の 1 本で、
# ルーレットはクエリ（`?tool=roulette`）で宣言する。
#
# 50 番は空き番号（05・20・30・40・90 が使用中）。/roulette/* は既存の断片と接頭辞が重ならない。

# 静的配信（SPA フォールバック付き・base=/roulette/ でビルドしたもの）
handle_path /roulette/* {
	root * /var/www/tasuki-roulette
	try_files {path} /index.html
	file_server
}

# /roulette（末尾スラッシュなし）を /roulette/ へ
redir /roulette /roulette/ permanent
