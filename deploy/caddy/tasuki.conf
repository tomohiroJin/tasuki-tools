# Tasuki のサイトブロック（ホストの /etc/caddy/Caddyfile へ import する）
#
# ホスト側 /etc/caddy/Caddyfile には次の 1 行だけを置く:
#
#     import /etc/caddy/tasuki/site.conf
#
# そしてこのファイルを /etc/caddy/tasuki/site.conf として設置する。
# アプリごとの handle は /etc/caddy/tasuki/apps/*.conf に分けて置き、
# ここでは import するだけにする（アプリを増やしてもこのファイルは変わらない）。
#
# ── 順序の制約（重要）──────────────────────────────────────────────
# Caddy の handle は**記述順に評価され、最初にマッチしたものだけが実行される**。
# したがって断片は「具体的なパス → 包括的なフォールバック」の順に読ませる必要がある。
# import のグロブは**ファイル名順に展開される**ため、番号接頭辞で順序を固定する:
#
#     10-timer-ws.conf    /ws*        → timer の sync（具体）
#     20-poker.conf       /poker/*    → poker（具体・S4 で有効化）
#     90-timer-spa.conf   それ以外     → timer の SPA フォールバック（包括・必ず最後）
#
# 90- を先に読ませると全部それに吸われ、/ws が WebSocket にならず index.html が
# 200 で返る（本番で /poker が timer の index.html を返していたのと同じ現象）。
#
# ドメイン名を指定しているため TLS は Caddy が自動取得する（ACME）。

<公開ドメイン> {
	root * /var/www/tasuki
	encode zstd gzip

	# レスポンスヘッダ（検索除外 + 基本的なセキュリティヘッダ）
	header {
		Strict-Transport-Security "max-age=31536000; includeSubDomains"
		X-Robots-Tag "noindex, nofollow"
		X-Content-Type-Options "nosniff"
		X-Frame-Options "SAMEORIGIN"
		Referrer-Policy "same-origin"
	}

	import /etc/caddy/tasuki/apps/*.conf
}
