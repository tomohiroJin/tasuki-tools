# Tasuki のサイトブロック（ホストの /etc/caddy/Caddyfile へ import する）
#
# ホスト側 /etc/caddy/Caddyfile には次の 1 行だけを置く:
#
#     import /etc/caddy/tasuki/site.conf
#
# そしてこのファイルを /etc/caddy/tasuki/site.conf として設置する。
# アプリごとの handle は /etc/caddy/tasuki/apps/*.conf に分けて置き、
# ここでは import するだけにする（アプリを増やしてもこのファイルは変わらない）。
#
# ── 断片の顔ぶれ（#95 S5c 時点）────────────────────────────────
#     05-hub-ws.conf             /ws        → 統合 sync（唯一の WS 入口。クエリの
#                                              ?tool= で timer/poker/ハブを振り分ける）
#     20-poker.conf              /poker/*   → poker（WS の handle は S5c で撤去済み）
#     30-timer-spa.conf          /timer/*   → timer の SPA
#     40-topic.conf              /topic/*   → topic（#91。配布の順序は deploy/topic/NOTES.md）
#     50-roulette.conf           /roulette/* → roulette（#94。配布の順序は deploy/roulette/NOTES.md）
#     60-agenda.conf             /agenda/* → agenda（#429。配布の順序は deploy/agenda/NOTES.md）
#     90-landing.conf            それ以外    → 玄関 LP（包括フォールバック・ハブの画面）
#
#     ⚠ 40-timer-legacy-room.conf（`/` + room → /timer/ へ 301）は **#95 S5a で撤去した**。
#       参加用 URL が `/?room=CODE` になったので、残すと新しい招待リンクが
#       タイマーへ飛ばされる（`docs/adr/0018` 決定 4）。**ホストからも消すこと。**
#
# **番号は人が読むための規約で、評価順の担保ではない。** Caddy はルートを
# マッチャの具体性で並べ替えるため、包括フォールバックは書いた位置に関わらず
# 最後に回る（2026-08-05 に 2.11.4 で実測）。危ないのは順序ではなく、
# 同じ具体性のマッチャを 2 つ書いて片方が黙って死ぬこと。詳細は README.md。
#
# 下の root は既定値。各断片が自分の配信元を明示するため、実際には使われない。
#
# ドメイン名を指定しているため TLS は Caddy が自動取得する（ACME）。

<公開ドメイン> {
	root * /var/www/tasuki
	encode zstd gzip

	# レスポンスヘッダ（検索除外 + 基本的なセキュリティヘッダ）
	header {
		Strict-Transport-Security "max-age=31536000; includeSubDomains"
		X-Robots-Tag "noindex, nofollow"
		X-Content-Type-Options "nosniff"
		X-Frame-Options "SAMEORIGIN"
		Referrer-Policy "same-origin"
		# CSP（ADR 0012 D7）。
		# - script-src は 'self' で足りる。ビルド成果物にインライン script は無い
		#   （3 アプリすべてで実測）。img-src の data: は 2 つの理由で要る。
		#   (1) 羅紗の織り目の模様が CSS の data: SVG
		#       （packages/ui/src/elements/reset.css・apps/timer-web/src/styles/base.css）
		#   (2) 招待の QR コードが data: の画像（packages/invite-ui/src/use-invite-qr.ts が
		#       toDataURL で <img src="data:image/png…"> を作る）。外すと QR が出なくなる
		#   favicon は #434 で実ファイルになったので、理由に数えない
		# - connect-src は 'self' で足りる。WS は同一オリジン（buildSyncUrl が
		#   location.host を使う）。公開ドメインを書くとプレースホルダの
		#   ドリフト源が 1 つ増える
		# - style-src の 'unsafe-inline' は React のインラインスタイルのため。
		#   【2026-08-13 Task 17 実測により訂正】当初「CSS 変数へ寄せたら外せる」と
		#   書いたが、これは正確ではなかった。React の style prop は CSS プロパティを
		#   1 つずつ代入する経路で適用され、この経路は Chromium の CSP style-src の
		#   inline 判定に掛からない（cssText / setAttribute('style', ...) / <style> 要素の
		#   挿入 / innerHTML 経由の style="" は掛かることを実測済み）。リポジトリ内に
		#   cssText・setAttribute('style') の使用は 0 件。外す条件は「CSS 変数へ寄せる」
		#   ではなく、style={{}} を使う画面（timer-web の Session / Summary 系。実サーバー
		#   とルーム作成が要るため e2e の領分）まで到達して違反 0 件を確認すること。外した
		#   あとは生 DOM スタイル操作（cssText / setAttribute('style') / <style> 動的挿入 /
		#   innerHTML の style=""）を持ち込まないこと。持ち込むと unsafe-inline が要る
		Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'"
	}

	# キャッシュ（#434）。ハッシュ付きの資材（*/assets/ 配下の拡張子つき）だけ 1 年・immutable、
	# それ以外（HTML・og.png など）は毎回確かめさせる。配布で index.html が差し替わっても
	# 古い資材を指さないための分け方。
	# - エラーの応答（404 の消えた資材など）は handle_errors で no-cache に上書きする。
	#   immutable が付くと、配布の途中に覚えた欠落を利用者のブラウザが 1 年持ち続ける。
	#   header は応答を書く前に付くので、file_server が 404 を返しても immutable が残っている。
	#   - `header { … match status 2xx }` は使わない。当時の本番の Caddy 2.6.2（Debian の apt）は
	#     match を条件と読まず「match という見出しの置き換え」と読み、404 にも immutable が付いた
	#     （2026-10-24 の配布で実測。E2E の 2.11.4 では効くので手元では緑だった）。
	#     本番は 2026-10-25 に 2.11.7 へ上げたが、版に依らない handle_errors の形のままにする
	#   - defer も使わない（状態コードを見ない）
	# - 拡張子の条件は、拡張子なしの /…/assets/x（断片が index.html へ書き換える）を
	#   immutable な HTML としてキャッシュさせないため。
	# - @hashed と @unhashed は厳密な補集合（not { 同じ 2 行 }）。同じ応答に 2 つは付かない。
	# - Go の MIME 表に .webmanifest が無く、Caddy は text/plain＋nosniff で返してしまうので、
	#   Content-Type を明示する。
	@hashed {
		path */assets/*
		path_regexp \.[^/]+$
	}
	@unhashed not {
		path */assets/*
		path_regexp \.[^/]+$
	}
	header @hashed Cache-Control "public, max-age=31536000, immutable"
	header @unhashed Cache-Control "no-cache"
	header /site.webmanifest Content-Type "application/manifest+json"
	handle_errors {
		header Cache-Control "no-cache"
	}

	import /etc/caddy/tasuki/apps/*.conf
}
